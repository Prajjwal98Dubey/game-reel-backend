services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gamereels
      MYSQL_USER: gamereels
      MYSQL_PASSWORD: gamereels
      MYSQL_ROOT_PASSWORD: gamereels-root
    ports:
      - '3306:3306'
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ugamereels', '-pgamereels']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  mysqldata:
